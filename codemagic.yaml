workflows:
  android-apk:
    name: The Closet — Android APK (debug, installable directly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Prepare www folder for Capacitor
        script: |
          mkdir -p www
          cp -r index.html css js manifest.json service-worker.js icons www/
      - name: Add Android platform (safe to re-run)
        script: npx cap add android || true
      - name: Sync web assets into the Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-ipa:
    name: The Closet — iOS IPA (requires your own Apple Developer account)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thecloset.app
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Prepare www folder for Capacitor
        script: |
          mkdir -p www
          cp -r index.html css js manifest.json service-worker.js icons www/
      - name: Add iOS platform (safe to re-run)
        script: npx cap add ios || true
      - name: Sync web assets into the iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build IPA
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
